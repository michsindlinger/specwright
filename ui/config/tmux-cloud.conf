# tmux config for Specwright cloud-terminal session persistence.
#
# The tmux server started with this config is a pure PTY host: it must be
# completely invisible to the inner application (Claude Code TUI or a shell).
# Every setting here exists to neutralize a tmux default that would otherwise
# leak through to the user.

# CRITICAL: no prefix key — Ctrl-B must reach the inner app (emacs backward-char
# in Claude's input box). All tmux keybindings are effectively disabled.
set -g prefix None
# Wipe ALL default bindings, then bind ONLY what we need below. This keeps
# tmux invisible: no right-click menus (MouseDown3Pane), no border dragging,
# no copy-mode key surprises. Notes: bare `unbind-key -a` clears only the
# PREFIX table (bind-key's default), so root/copy-mode must be named
# explicitly; `-q` because an already-empty table is removed and unbinding it
# again would otherwise error and ABORT source-file (config re-sync on backend
# start applies this file to the long-lived server).
unbind-key -a -q
unbind-key -a -q -T root
unbind-key -a -q -T copy-mode
unbind-key -a -q -T copy-mode-vi

# No status bar, no titles, no rename magic — the outer xterm.js is the UI.
set -g status off
set -g set-titles off
set -g allow-rename off
set -g bell-action none

# Scrollback matches CLOUD_TERMINAL_CONFIG.MAX_BUFFER_LINES (capture-pane seeds
# the backend buffer from this history after a restart).
set -g history-limit 10000

# No ESC delay — Claude's ESC handling must stay instant.
set -s escape-time 0

# Mouse on: tmux owns scrolling. The wheel enters copy-mode and scrolls tmux's
# own 10k-line history — the ONLY consistent scrollback with a constantly
# redrawing TUI like Claude Code (see the alternate-screen note below). Apps
# that request mouse tracking themselves still get the events passed through
# (mouse_any_flag in the bindings below).
set -g mouse on

# The server survives with zero sessions (required so the dedicated systemd
# unit on the droplet stays alive between sessions).
set -s exit-empty off

# The session follows the most recent client resize → node-pty resize works
# natively via SIGWINCH.
set -g window-size latest

# Inner command exits → session is destroyed → the attach client exits → the
# backend's node-pty onExit fires. This is the exit-detection chain.
set -g detach-on-destroy on

# TERM inside the session. screen-256color is universally present in terminfo
# (tmux-256color is missing on stock macOS ncurses). The backend upgrades this
# to tmux-256color at runtime when the host terminfo has it.
set -g default-terminal "screen-256color"

# Scrolling model: tmux client stays on the ALTERNATE screen (default), and
# scrolling happens in tmux copy-mode against tmux's own history.
#
# Why not the normal buffer (a ',*:smcup@:rmcup@' override was tried): Claude
# Code's TUI (Ink) redraws its UI constantly. With tmux in between, every
# redraw pushes another copy of the visible screen into the outer xterm.js
# scrollback — the history fills with duplicated blocks and the real past
# scrolls out of reach. On the alternate screen the outer scrollback stays
# empty; the wheel reaches tmux as SGR mouse events (xterm.js sends those
# whenever mouse tracking is active) and tmux shows its consistent, duplicate-
# free 10k-line history. Cost: browser text selection needs Shift+drag while
# mouse mode is on — accepted trade-off.
#
# `set -gu` first: terminal-overrides is append-only (-ga), so a server that
# still carries entries from an older config version must be reset when this
# file is re-applied via source-file (config sync on backend start).
set -gu terminal-overrides
set -su terminal-features
set -as terminal-features ',xterm-256color:RGB'

# Deterministic key-table: without this, tmux derives vi/emacs from the
# VISUAL/EDITOR environment — with vi it consults `copy-mode-vi`, and the
# bindings below (in `copy-mode`) would silently never fire.
set -g mode-keys emacs

# The ONLY bindings this server has (everything else was unbound above).
# Wheel up outside copy-mode: pass through when the app itself requested mouse
# tracking, otherwise enter copy-mode. `-e` exits copy-mode automatically when
# scrolled back to the bottom. Explicit binds also repair a long-lived server
# whose default tables were wiped by an earlier config (source-file re-applies
# this whole file on backend start).
bind-key -n WheelUpPane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'
bind-key -n WheelDownPane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -T copy-mode WheelUpPane send-keys -X -N 3 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 3 scroll-down
bind-key -T copy-mode Escape send-keys -X cancel

# Mouse selection lives in tmux, not in xterm: plain drag enters copy-mode and
# selects; dragging past the top edge (or wheeling mid-drag) scrolls the tmux
# history, so selections can span far more than one screen — impossible with a
# client-side (xterm) selection, whose grid shifts away under tmux scrolling.
# Releasing the button copies the selection and returns to the live view.
bind-key -n MouseDrag1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M' 'copy-mode -M'
bind-key -n MouseDown1Pane if-shell -F '#{mouse_any_flag}' 'send-keys -M'
bind-key -T copy-mode MouseDrag1Pane send-keys -X begin-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDown1Pane send-keys -X clear-selection

# The copied selection reaches the browser as an OSC 52 sequence; the frontend
# (aos-terminal OSC-52 handler) forwards it to the clipboard. The
# terminal-features 'clipboard' entry tells tmux the outer terminal accepts
# OSC 52 (xterm.js does, via our handler).
set -s set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'
